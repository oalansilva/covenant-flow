version: 1
schema_version: 1
forbid: [composer-2.5-fast, inherit, auto]
roles:
  grill-card: juizo
  design-autor: juizo
  design-author: juizo
  design-critic: juizo
  assessment-a: juizo
  assessment-b: juizo
  apply-coluna: execucao
  qa-gate: execucao
  qa-dev: execucao
  diff-reviewer: execucao
  code-reviewer: execucao
  same-card-search: execucao
  fecho-lote: execucao
clients:
  cursor:
    contract: cursor-task-model-v1
    fields: [label, model]
    required: [label, model]
  codex:
    contract: codex-agent-pair-v1
    fields: [label, model, effort]
    required: [label, model, effort]
  grok:
    contract: grok-spawn-model-v1
    fields: [label, model]
    required: [label, model]
  opencode:
    contract: opencode-task-unavailable-v1
    fields: [label, model, provider, variant]
    required: [label, model, provider]
  dsh:
    contract: dsh-subagent-selection-v1
    fields: [label, model, provider, effort]
    required: [label, model, provider]
  claude:
    contract: claude-agent-pair-v1
    fields: [label, model, effort]
    required: [label, model, effort]
    # Capability translation, not a second model map: encodes the selected full
    # model id into the family alias accepted by the Agent tool's `model`.
    host_model_aliases: {claude-opus: opus, claude-sonnet: sonnet, claude-haiku: haiku, claude-fable: fable}
    efforts: [low, medium, high, xhigh, max]
    host_min_version: "2.1.292"
    env_overrides: [CLAUDE_CODE_SUBAGENT_MODEL, CLAUDE_CODE_SUBAGENT_MODEL_FORCE, CLAUDE_CODE_EFFORT_LEVEL]
